name: e_santri
description: "Aplikasi presensi dan monitoring santri pondok pesantren."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.18.0

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Offline
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  connectivity_plus: ^7.3.2

  # Lain-lain
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#075C3B"
  adaptive_icon_foreground: assets/images/logo.png